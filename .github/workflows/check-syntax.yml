name: Check JavaScript Syntax

on:
  # push:
  #   branches:
  #     - main
  pull_request:
  workflow_dispatch:

jobs:
  check-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Run Math Demos
        run: |
          node collatz-simulator.js
          node prime-checker.js
          node sierpinski.js
          node square-root-newton.js
